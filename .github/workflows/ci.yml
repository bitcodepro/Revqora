name: CI

# PRs produce checked preview packages. Main produces the next release after all checks.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump on main
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      release_version:
        description: Optional explicit SemVer on main, e.g. 0.1.0 or 0.2.0-rc.1
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-tooling:
    name: Release tooling tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - run: python -B -m unittest discover -s tests/release -v

  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install Rust toolchain
        shell: bash
        run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt clippy
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci

      - run: npm run verify:quick

  windows-smoke:
    name: Full Windows verification and WebView2 smoke test
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install Rust toolchain
        shell: bash
        run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt clippy
      - run: npm ci
      - name: Ensure WebView2 Runtime
        shell: pwsh
        run: |
          function Find-WebView2 {
            $roots = @("${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application", "$env:ProgramFiles\Microsoft\EdgeWebView\Application", "$env:LOCALAPPDATA\Microsoft\EdgeWebView\Application")
            foreach ($root in $roots) {
              Get-ChildItem -LiteralPath $root -Directory -ErrorAction SilentlyContinue |
                Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName 'msedgewebview2.exe') } |
                Select-Object -ExpandProperty FullName
            }
          }
          $runtime = Find-WebView2 | Select-Object -First 1
          if (-not $runtime) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer -MaximumRetryCount 3 -RetryIntervalSec 3
            $installed = Start-Process -FilePath $installer -ArgumentList '/silent', '/install' -WindowStyle Hidden -Wait -PassThru
            if ($installed.ExitCode -notin @(0, 3010)) { throw "WebView2 installer failed: $($installed.ExitCode)" }
            $runtime = Find-WebView2 | Select-Object -First 1
          }
          if (-not $runtime) { throw 'WebView2 Runtime executable was not found' }
          "WEBVIEW2_BROWSER_EXECUTABLE_FOLDER=$runtime" >> $env:GITHUB_ENV
      - name: Verify native UI startup before release compilation
        env:
          REVQORA_VERIFY_UI_AUTOMATION: '1'
          REVQORA_SMOKE_VISIBLE: '1'
        shell: pwsh
        run: |
          Write-Output "Interactive=$([Environment]::UserInteractive); Session=$((Get-Process -Id $PID).SessionId)"
          cargo build --manifest-path src-tauri/Cargo.toml --features ui-automation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/ui-startup.mjs --exe src-tauri/target/debug/revqora.exe
          exit $LASTEXITCODE
      - run: npm run verify
        env:
          REVQORA_VERIFY_UI_AUTOMATION: '1'
          REVQORA_SMOKE_OUT: ${{ runner.temp }}/smoke-shots
          REVQORA_SMOKE_VISIBLE: '1'
      - name: Upload UI smoke screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-smoke-screenshots
          path: ${{ runner.temp }}/smoke-shots
          if-no-files-found: ignore
          retention-days: 7

  version:
    name: Select release or preview version
    needs: [release-tooling, build-and-test, windows-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BUMP: ${{ inputs.bump || 'auto' }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ] && { [ "$EVENT_NAME" = push ] || [ "$EVENT_NAME" = workflow_dispatch ]; }; then
            python scripts/release.py version
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "version=0.0.0-pr.${PR_NUMBER:-$GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  packages:
    name: Packages
    needs: version
    if: needs.version.outputs.skip != 'true'
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}

  verify-packages:
    name: Verify downloaded release packages
    needs: [version, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Revqora-*
          path: dist/packages
          merge-multiple: true
      - name: Check all five archive/checksum pairs
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: python scripts/release.py verify --directory dist/packages --version "$VERSION" --commit "$GITHUB_SHA"

  release:
    name: Publish release from main
    needs: [release-tooling, build-and-test, windows-smoke, version, packages, verify-packages]
    if: >-
      github.repository == 'bitcodepro/Revqora' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.version.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Revqora-*
          path: dist/packages
          merge-multiple: true
      - name: Verify packages, reserve immutable tag, upload draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: python scripts/release.py publish --directory dist/packages --version "$VERSION"
