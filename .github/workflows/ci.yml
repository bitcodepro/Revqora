name: CI

# PRs produce checked preview packages. Main produces the next release after all checks.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump on main
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      release_version:
        description: Optional explicit SemVer on main, e.g. 0.1.0 or 0.2.0-rc.1
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-tooling:
    name: Release tooling tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - run: python -B -m unittest discover -s tests/release -v

  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Rust toolchain
        shell: bash
        run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt clippy
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci

      - run: npm run verify:quick

      # Retain both production and automation-feature Rust checks, outside the
      # native critical path. They do not open an application window.
      - name: Lint and test the Windows automation feature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features ui-automation -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --features ui-automation
          exit $LASTEXITCODE

      - name: Diagnose Windows agent launch in both configurations
        if: runner.os == 'Windows' && !cancelled()
        env:
          REVQORA_TEST_TMP: ${{ github.workspace }}/.ci-temp/agent-windows-diagnostics
          TEMP: ${{ github.workspace }}/.ci-temp/agent-windows-diagnostics
          TMP: ${{ github.workspace }}/.ci-temp/agent-windows-diagnostics
          TMPDIR: ${{ github.workspace }}/.ci-temp/agent-windows-diagnostics
        run: node scripts/agent-windows-diagnostics.mjs --out ci-results/agent-windows-diagnostics

      - name: Retain Windows agent diagnostic evidence
        if: runner.os == 'Windows' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-agent-diagnostics
          path: ci-results/agent-windows-diagnostics
          if-no-files-found: warn
          retention-days: 7

  windows-native-build:
    name: Build Windows native smoke executable once
    runs-on: windows-2025
    timeout-minutes: 25
    outputs:
      sha256: ${{ steps.bundle.outputs.sha256 }}
    env:
      REVQORA_TEST_TMP: ${{ github.workspace }}/.ci-temp
      TEMP: ${{ github.workspace }}/.ci-temp
      TMP: ${{ github.workspace }}/.ci-temp
      TMPDIR: ${{ github.workspace }}/.ci-temp
    steps:
      - name: Start preparation timer
        shell: pwsh
        run: '"CI_PREPARATION_STARTED=$([DateTimeOffset]::UtcNow.ToString("o"))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare isolated temporary directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:REVQORA_TEST_TMP | Out-Null
      - name: Install Rust toolchain
        shell: bash
        run: rustup update stable --no-self-update && rustup default stable
      - run: npm ci
      - name: Ensure WebView2 Runtime
        shell: pwsh
        run: |
          function Find-WebView2 {
            $roots = @("${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application", "$env:ProgramFiles\Microsoft\EdgeWebView\Application", "$env:LOCALAPPDATA\Microsoft\EdgeWebView\Application")
            foreach ($root in $roots) {
              Get-ChildItem -LiteralPath $root -Directory -ErrorAction SilentlyContinue |
                Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName 'msedgewebview2.exe') } |
                Select-Object -ExpandProperty FullName
            }
          }
          $runtime = Find-WebView2 | Select-Object -First 1
          if (-not $runtime) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer -MaximumRetryCount 3 -RetryIntervalSec 3
            $installed = Start-Process -FilePath $installer -ArgumentList '/silent', '/install' -WindowStyle Hidden -Wait -PassThru
            if ($installed.ExitCode -notin @(0, 3010)) { throw "WebView2 installer failed: $($installed.ExitCode)" }
            $runtime = Find-WebView2 | Select-Object -First 1
          }
          if (-not $runtime) { throw 'WebView2 Runtime executable was not found' }
          "WEBVIEW2_BROWSER_EXECUTABLE_FOLDER=$runtime" >> $env:GITHUB_ENV
      - name: Report preparation duration
        shell: pwsh
        run: |
          $seconds = [Math]::Round(([DateTimeOffset]::UtcNow - [DateTimeOffset]::Parse($env:CI_PREPARATION_STARTED)).TotalSeconds, 3)
          New-Item -ItemType Directory -Force -Path ci-results | Out-Null
          @{ phase = 'preparation'; seconds = $seconds } | ConvertTo-Json | Set-Content ci-results/preparation.json
          "Preparation (checkout, tools, dependencies, runtime/artifact): $seconds seconds" >> $env:GITHUB_STEP_SUMMARY
      - name: Release build and portable zip
        run: npm run verify -- --build-only
        env:
          REVQORA_VERIFY_UI_AUTOMATION: '1'
          REVQORA_VERIFY_TIMINGS: ${{ github.workspace }}/ci-results/build-timings.json
      - name: Verify native transport on the already built release executable
        run: node scripts/ui-startup.mjs --exe release/Revqora/revqora.exe
        env:
          REVQORA_VERIFY_UI_AUTOMATION: '1'
          REVQORA_SMOKE_VISIBLE: '1'
      - name: Bind the native artifact to this build
        id: bundle
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem release/Revqora-*-win-x64.zip)
          if ($archives.Count -ne 1) { throw 'Expected one native build archive' }
          "sha256=$((Get-FileHash -LiteralPath $archives[0].FullName -Algorithm SHA256).Hash)" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-native-smoke-build
          path: release/Revqora-*-win-x64.zip
          if-no-files-found: error
          retention-days: 3
      - name: Upload build timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-native-build-timings
          path: ci-results
          if-no-files-found: ignore
          retention-days: 7

  windows-smoke:
    name: Native Windows UI (${{ matrix.suite }})
    needs: windows-native-build
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [core, workspace, cleanup, worktrees]
    env:
      REVQORA_TEST_TMP: ${{ github.workspace }}/.ci-temp
      TEMP: ${{ github.workspace }}/.ci-temp
      TMP: ${{ github.workspace }}/.ci-temp
      TMPDIR: ${{ github.workspace }}/.ci-temp
      REVQORA_SMOKE_SUITE: ${{ matrix.suite }}
      REVQORA_SMOKE_OUT: ${{ github.workspace }}/ci-results/${{ matrix.suite }}
      REVQORA_VERIFY_UI_AUTOMATION: '1'
      REVQORA_SMOKE_VISIBLE: '1'
    steps:
      - name: Start preparation timer
        shell: pwsh
        run: '"CI_PREPARATION_STARTED=$([DateTimeOffset]::UtcNow.ToString("o"))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare isolated temporary directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:REVQORA_TEST_TMP | Out-Null
      - run: npm ci
      - name: Ensure WebView2 Runtime
        shell: pwsh
        run: |
          function Find-WebView2 {
            $roots = @("${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application", "$env:ProgramFiles\Microsoft\EdgeWebView\Application", "$env:LOCALAPPDATA\Microsoft\EdgeWebView\Application")
            foreach ($root in $roots) {
              Get-ChildItem -LiteralPath $root -Directory -ErrorAction SilentlyContinue |
                Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName 'msedgewebview2.exe') } |
                Select-Object -ExpandProperty FullName
            }
          }
          $runtime = Find-WebView2 | Select-Object -First 1
          if (-not $runtime) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer -MaximumRetryCount 3 -RetryIntervalSec 3
            $installed = Start-Process -FilePath $installer -ArgumentList '/silent', '/install' -WindowStyle Hidden -Wait -PassThru
            if ($installed.ExitCode -notin @(0, 3010)) { throw "WebView2 installer failed: $($installed.ExitCode)" }
            $runtime = Find-WebView2 | Select-Object -First 1
          }
          if (-not $runtime) { throw 'WebView2 Runtime executable was not found' }
          "WEBVIEW2_BROWSER_EXECUTABLE_FOLDER=$runtime" >> $env:GITHUB_ENV
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-native-smoke-build
          path: native-build
      - name: Verify and extract the exact built executable
        env:
          EXPECTED_SHA256: ${{ needs.windows-native-build.outputs.sha256 }}
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem native-build/Revqora-*-win-x64.zip)
          if ($archives.Count -ne 1) { throw 'Expected one native build archive' }
          if ((Get-FileHash -LiteralPath $archives[0].FullName -Algorithm SHA256).Hash -ne $env:EXPECTED_SHA256) { throw 'Native build SHA-256 mismatch' }
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath native-build/app
      - name: Report preparation duration
        shell: pwsh
        run: |
          $seconds = [Math]::Round(([DateTimeOffset]::UtcNow - [DateTimeOffset]::Parse($env:CI_PREPARATION_STARTED)).TotalSeconds, 3)
          New-Item -ItemType Directory -Force -Path ci-results | Out-Null
          @{ phase = 'preparation'; seconds = $seconds } | ConvertTo-Json | Set-Content ci-results/preparation.json
          "Preparation (checkout, tools, dependencies, runtime/artifact): $seconds seconds" >> $env:GITHUB_STEP_SUMMARY
      - name: Run the independent native suite
        shell: pwsh
        run: |
          $driver = if ($env:REVQORA_SMOKE_SUITE -eq 'core') { 'scripts/ui-smoke.mjs' } else { 'scripts/ui-suite.mjs' }
          node $driver --exe native-build/app/Revqora/revqora.exe
          exit $LASTEXITCODE
      - name: Upload native timings and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-smoke-${{ matrix.suite }}
          path: ci-results
          if-no-files-found: ignore
          retention-days: 7

  version:
    name: Select release or preview version
    needs: release-tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BUMP: ${{ inputs.bump || 'auto' }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ] && { [ "$EVENT_NAME" = push ] || [ "$EVENT_NAME" = workflow_dispatch ]; }; then
            python scripts/release.py version
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "version=0.0.0-pr.${PR_NUMBER:-$GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  packages:
    name: Packages
    needs: version
    if: needs.version.outputs.skip != 'true'
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}

  verify-packages:
    name: Verify downloaded release packages
    needs: [version, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Revqora-*
          path: dist/packages
          merge-multiple: true
      - name: Check all five archive/checksum pairs
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: python scripts/release.py verify --directory dist/packages --version "$VERSION" --commit "$GITHUB_SHA"

  release:
    name: Publish release from main
    needs: [release-tooling, build-and-test, windows-smoke, version, packages, verify-packages]
    if: >-
      github.repository == 'bitcodepro/Revqora' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.version.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Revqora-*
          path: dist/packages
          merge-multiple: true
      - name: Verify packages, reserve immutable tag, upload draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: python scripts/release.py publish --directory dist/packages --version "$VERSION"
