[package]
name = "revqora"
version = "0.1.0"
description = "Revqora — a fast, beautiful Git client"
authors = ["Revqora"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "revqora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
ui-automation = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
fs2 = "0.4"
regex = "1"
notify = "8"
tempfile = "3"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
