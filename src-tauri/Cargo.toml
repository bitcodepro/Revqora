[package]
name = "revqora"
version = "0.1.0"
description = "Revqora — a fast, beautiful Git client"
authors = ["Revqora"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "revqora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
notify = "8"
tempfile = "3"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
